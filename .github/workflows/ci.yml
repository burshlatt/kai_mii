name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deadline
          POSTGRES_PASSWORD: deadline
          POSTGRES_DB: deadline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deadline -d deadline_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci-secret-change-me
      DATABASE_URL: postgresql://deadline:deadline@127.0.0.1:5432/deadline_test
      FRONTEND_ORIGIN: http://localhost:5173
      PUBLIC_API_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deadline/backend/package-lock.json
      - name: Install
        working-directory: deadline/backend
        run: npm ci
      - name: Lint
        working-directory: deadline/backend
        run: npm run lint
      - name: Format
        working-directory: deadline/backend
        run: npm run format:check
      - name: Test
        working-directory: deadline/backend
        run: npm test
      - name: Build
        working-directory: deadline/backend
        run: npm run build
      - name: Audit
        working-directory: deadline/backend
        run: npm audit --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deadline/frontend/package-lock.json
      - name: Install
        working-directory: deadline/frontend
        run: npm ci
      - name: Lint
        working-directory: deadline/frontend
        run: npm run lint
      - name: Format
        working-directory: deadline/frontend
        run: npm run format:check
      - name: Test
        working-directory: deadline/frontend
        run: npm test
      - name: Build
        working-directory: deadline/frontend
        run: npm run build
      - name: Audit
        working-directory: deadline/frontend
        run: npm audit --audit-level=high

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        working-directory: deadline
        env:
          JWT_SECRET: ci-secret-change-me
          FRONTEND_ORIGIN: http://localhost:8080
          PUBLIC_API_ORIGIN: http://localhost:8080
        run: docker compose build
      - name: Deploy
        if: vars.DEPLOY_ENABLED == 'true'
        working-directory: deadline
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: sh scripts/remote-deploy.sh

  vercel:
    if: >-
      vars.VERCEL_DEPLOY_ENABLED == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      )
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Deploy
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            environment=production
            prod_flag=--prod
          else
            environment=preview
            prod_flag=
          fi
          vercel pull --yes --environment="$environment" --token="$VERCEL_TOKEN"
          vercel build $prod_flag --yes --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt $prod_flag --yes --token="$VERCEL_TOKEN")
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
