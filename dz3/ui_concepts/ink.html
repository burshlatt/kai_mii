<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Чернильница</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,560;0,9..144,560&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #efe6d6; color: #1e2430; font-family: "Source Sans 3", sans-serif; }
      .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
      aside { background: #1e2430; color: #efe6d6; padding: 32px 24px; }
      .eyebrow { letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; color: #ddcfb8; }
      h1 { font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 560; font-size: 36px; margin: 12px 0 0; }
      main { padding: 36px 48px; }
      .nums { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid #ddcfb8; background: #fbf6ee; }
      .nums div { padding: 12px 16px; border-right: 1px solid #ddcfb8; }
      .nums div:last-child { border-right: 0; }
      .nums b { display: block; font-family: Fraunces, Georgia, serif; font-size: 36px; font-weight: 560; }
      .seal { color: #8f3d2b; }
      article { display: grid; grid-template-columns: 1fr auto; gap: 16px; border-bottom: 1px solid #ddcfb8; padding: 16px 0; }
      .course { color: #2c4a3e; letter-spacing: 0.14em; text-transform: uppercase; font-size: 12px; font-weight: 600; }
      h2 { font-family: Fraunces, Georgia, serif; font-size: 26px; margin: 4px 0; font-weight: 560; }
      button { background: #1e2430; color: #efe6d6; border: 0; padding: 10px 14px; font: inherit; }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside>
        <div class="eyebrow">Учебные задания</div>
        <h1>Дедлайн</h1>
        <p>Алина</p>
      </aside>
      <main>
        <div class="eyebrow">Концепция «Чернильница»</div>
        <h1 style="font-style: normal">Что сдавать</h1>
        <div class="nums">
          <div><span>Всего</span><b>4</b></div>
          <div><span>К выполнению</span><b>2</b></div>
          <div><span>В работе</span><b>1</b></div>
          <div><span>Просрочено</span><b class="seal">1</b></div>
        </div>
        <article>
          <div>
            <div class="course">История</div>
            <h2>Эссе про городской транспорт</h2>
            <div class="seal">8 окт. 2026 · просрочено · Высокий</div>
          </div>
          <div>К выполнению</div>
        </article>
        <article>
          <div>
            <div class="course">Алгоритмы</div>
            <h2>Лабораторная по графам</h2>
            <div>12 окт. 2026 · Средний</div>
          </div>
          <div>В работе</div>
        </article>
        <button>Новое задание</button>
      </main>
    </div>
  </body>
</html>
