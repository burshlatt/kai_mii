services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deadline
      POSTGRES_USER: deadline
      POSTGRES_PASSWORD: deadline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadline -d deadline"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    image: deadline-api
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://deadline:deadline@db:5432/deadline
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  monitor:
    image: deadline-api
    depends_on:
      api:
        condition: service_healthy
    environment:
      HEALTH_URL: http://api:3001/api/health
      HEALTH_INTERVAL_MS: "30000"
      LOG_LEVEL: info
    command: ["node", "dist/monitor-cli.js"]
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_METRIKA_ID: ${VITE_METRIKA_ID:-}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
